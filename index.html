<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Vijrumbhana Admin – NGO Form Management</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFFFFF;--c:#fff;--p:#2563EB;--t:#1F2937;--s:#6B7280;--b:#E5E7EB;--ok:#16A34A;--wa:#EA580C;--er:#DC2626;--r:3px;--hv:#EFF4FF;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:14px/1.5 'Public Sans',system-ui,sans-serif;color:var(--t);background:var(--bg);overflow-x:hidden;background-color:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{border:1px solid var(--b);background:var(--c);border-radius:var(--r);padding:8px 12px;cursor:pointer;min-height:36px}
button:hover{background:var(--hv)}button.pr{background:var(--p);border-color:var(--p);color:#fff}button.pr:hover{opacity:.9}
button.dg{color:var(--er)}button.sm{padding:4px 10px;min-height:30px}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--b);border-radius:var(--r);background:var(--c);min-height:38px}
input[type=checkbox],input[type=radio]{width:auto;min-height:0}
:focus-visible{outline:2px solid var(--p);outline-offset:1px}
label.l{display:block;font-weight:600;margin:12px 0 4px;font-size:13px}
.side{position:fixed;inset:0 auto 0 0;width:240px;background:var(--c);border-right:1px solid var(--b);padding:16px 12px;z-index:30;overflow:auto;transition:transform .2s}
.brand{font-weight:700;font-size:17px;padding:4px 8px 16px;display:flex;gap:8px;align-items:center}.brand i{width:24px;height:24px;background:var(--p);border-radius:var(--r);display:inline-block}
.side a{display:flex;justify-content:space-between;padding:9px 10px;border-radius:var(--r);color:var(--t);cursor:pointer;margin-bottom:2px}
.side a:hover{background:var(--hv)}.side a.on{background:var(--p);color:#fff}
.top{position:sticky;top:0;z-index:20;margin-left:240px;background:var(--c);border-bottom:1px solid var(--b);padding:10px 20px;display:flex;align-items:center;gap:12px}
.top h1{font-size:17px;margin:0;flex:1}.mb{display:none}
.main{margin-left:240px;padding:20px}.wrap{max-width:1180px;margin:0 auto}
.card{background:var(--c);border:1px solid var(--b);border-radius:var(--r);padding:16px;margin-bottom:16px}
.card h3{margin:0 0 12px;font-size:15px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));margin-bottom:16px}
.st{background:var(--c);border:1px solid var(--b);border-radius:var(--r);padding:14px}.st b{font-size:24px;display:block}.st span{color:var(--s);font-size:12px}
.two{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.tw{overflow-x:auto;border:1px solid var(--b);border-radius:var(--r);background:var(--c)}
table{border-collapse:collapse;width:100%;min-width:640px}th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--b);vertical-align:middle}
th{font-size:12px;color:var(--s);background:#F9FAFB;font-weight:600}tr:last-child td{border-bottom:0}
.bd{display:inline-block;padding:2px 8px;border-radius:var(--r);font-size:12px;font-weight:600;white-space:nowrap}
.bl{background:#DBEAFE;color:#1D4ED8}.ok{background:#DCFCE7;color:#15803D}.wa{background:#FFEDD5;color:#C2410C}.er{background:#FEE2E2;color:#B91C1C}.gr{background:#E5E7EB;color:#374151}
.bar{display:flex;gap:8px;align-items:center;margin:6px 0;font-size:13px}.bar u{flex:1;height:8px;background:#F3F4F6;border-radius:var(--r);overflow:hidden;text-decoration:none}.bar u i{display:block;height:100%;background:var(--p)}
.fl{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.fl>*{flex:1 1 150px;width:auto}.fl>button{flex:0 0 auto}
.sp{flex:1}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.mut{color:var(--s);font-size:12px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:center;justify-content:center;padding:12px}
.md{background:var(--c);border-radius:var(--r);width:100%;max-width:640px;max-height:92vh;overflow:auto;padding:18px}
.tst{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:var(--r);z-index:60}
/* form renderer */
.fpg{background:var(--bg);min-height:100%;padding:16px 12px 40px}.fc{max-width:760px;margin:0 auto 14px;background:var(--c);border:1px solid #D1D5DB;border-radius:var(--r);padding:20px 24px;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.fc.hd{border-top:8px solid var(--p)}.fc h2{margin:0 0 6px;font-size:24px}.fc h4{margin:0 0 4px;font-size:15px}.fc .rq{color:var(--er)}
.fc .opt{display:flex;gap:8px;align-items:center;padding:4px 0}.err{color:var(--er);font-size:12px;margin-top:4px}
.fc.sel{border-left:5px solid var(--p)}.pg{height:6px;background:var(--b);border-radius:var(--r);overflow:hidden}.pg i{display:block;height:100%;background:var(--p)}
.rt button{font-size:20px;padding:2px 8px;min-height:0}.rt button.on{color:#F59E0B}
.pv{background:#FEF3C7;color:#92400E;padding:8px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
/* builder */
.bt{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.tabs{display:none;gap:6px;margin-bottom:12px}.tabs button{flex:1}.tabs .on{background:var(--p);color:#fff}
.bg3{display:grid;grid-template-columns:220px minmax(0,1fr) 290px;gap:16px;align-items:start}
.bg3 aside{background:var(--c);border:1px solid var(--b);border-radius:var(--r);padding:12px;position:sticky;top:64px;max-height:calc(100vh - 80px);overflow:auto}
.pal{display:grid;grid-template-columns:1fr 1fr;gap:6px}.pal button{text-align:left;font-size:12px;padding:6px 8px}
.tb{display:flex;gap:4px;justify-content:flex-end;margin-top:8px}.tb button{padding:2px 8px;min-height:28px}
.sh{max-width:760px;margin:16px auto 6px;display:flex;gap:8px;align-items:center;font-weight:600}
@media(max-width:1100px){.bg3{grid-template-columns:1fr}.bg3>*{display:none}.tabs{display:flex}.t-add>aside:first-child,.t-form>section,.t-props>aside:last-child{display:block}.bg3 aside{position:static;max-height:none}}
@media(max-width:900px){.side{transform:translateX(-100%)}.side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.3)}.top,.main{margin-left:0}.mb{display:inline-block}.main{padding:12px}.fc{padding:16px}}
button{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:linear-gradient(#fff,#F3F4F6);border:1px solid #CBD0D8;box-shadow:inset 0 1px 0 #fff,0 1px 2px rgba(0,0,0,.18)}
button:hover{background:linear-gradient(#fff,#E8EEFB)}
button:active{box-shadow:inset 0 2px 3px rgba(0,0,0,.2);transform:translateY(1px)}
button.pr{background:linear-gradient(#3B82F6,#2563EB);border-color:#1D4ED8;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 1px 3px rgba(37,99,235,.45)}
button.pr:hover{background:linear-gradient(#4B8FF8,#1D4ED8)}
.pal button{justify-content:flex-start}.rt button{background:none;border:0;box-shadow:none;color:#9CA3AF}.rt button.on{color:#F59E0B}.rt button.on svg{fill:#F59E0B}
input,select,textarea{box-shadow:inset 0 1px 2px rgba(0,0,0,.08);border-color:#CBD0D8}
.card,.st,.tw,.md{border-color:#D1D5DB;box-shadow:inset 0 1px 0 #fff,0 2px 5px rgba(0,0,0,.08),0 1px 1px rgba(0,0,0,.05)}
.fc{border-color:#D1D5DB;box-shadow:inset 0 1px 0 #fff,0 2px 5px rgba(0,0,0,.1),0 1px 1px rgba(0,0,0,.06)}
.side{box-shadow:2px 0 8px rgba(0,0,0,.07);background:linear-gradient(#fff,#FAFAFB)}.top{box-shadow:0 2px 5px rgba(0,0,0,.07)}
.side a{border:1px solid transparent}.side a:hover:not(.on){background:linear-gradient(#fff,#F1F3F6);border-color:#E1E4EA;box-shadow:inset 0 1px 0 #fff,0 1px 2px rgba(0,0,0,.1)}
.side a.on{background:linear-gradient(#3B82F6,#2563EB);border-color:#1D4ED8;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 1px 3px rgba(37,99,235,.45)}
.ni{display:flex;align-items:center;gap:10px}.ni svg{flex:none}
.brand i{display:inline-flex;align-items:center;justify-content:center;color:#fff;background:linear-gradient(#3B82F6,#2563EB);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 1px 2px rgba(0,0,0,.3)}.brand i svg{width:15px;height:15px}
.fg{display:grid;grid-template-columns:repeat(3,minmax(0,210px));gap:16px;justify-content:start}
.sq{aspect-ratio:1;background:linear-gradient(#fff,#F9FAFB);border:1px solid #D1D5DB;border-radius:var(--r);padding:12px;display:flex;flex-direction:column;min-width:0;overflow:hidden;box-shadow:inset 0 1px 0 #fff,0 2px 5px rgba(0,0,0,.1),0 1px 1px rgba(0,0,0,.06)}
.sq h4{margin:8px 0 2px;font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sq .ib{display:flex;gap:4px;margin-top:auto}.sq .ib button,.mo{flex:1;padding:0;min-height:30px}
.ico{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;background:var(--hv);color:var(--p);border-radius:var(--r);flex:none}
.mo{position:relative;display:inline-flex;align-items:center;justify-content:center;border:1px solid #CBD0D8;border-radius:var(--r);background:linear-gradient(#fff,#F3F4F6);box-shadow:inset 0 1px 0 #fff,0 1px 2px rgba(0,0,0,.18);cursor:pointer}.mo select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.sq.add{align-items:center;justify-content:center;border:2px dashed #9CA3AF;background:#fff;color:var(--p);cursor:pointer;text-align:center;gap:6px;box-shadow:none}.sq.add:hover{background:var(--hv)}
@media(max-width:560px){.fg{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sitewrap{min-height:100vh;display:flex;flex-direction:column;background:#fff}.sitewrap main{flex:1}
.sb{background:#fff;border-bottom:1px solid #E1E4EA;position:sticky;top:0;z-index:20;box-shadow:0 2px 5px rgba(0,0,0,.07)}.sb .in,.foot .in{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}

<div class="row" style="margin-top:12px"><button onclick="dup('${b.id}')">Duplicate</button><button class="dg" onclick="del('${b.id}')">Delete</button></div>`}
if(s)return `<b>Section / page</b><label class="l">Title</label><input value="${esc(s.title)}" oninput="psec('title',this.value)"><label class="l">Description</label><textarea rows=3 oninput="psec('description',this.value)">${esc(s.description)}</textarea><div class="row" style="margin-top:12px"><button onclick="mv('${s.id}',-1)">Move up</button><button onclick="mv('${s.id}',1)">Move down</button><button class="dg" onclick="del('${s.id}')">Delete</button></div>`;
return `<b>Form settings</b>${badge(f.status)}<label class="l">Category</label><input value="${esc(f.category)}" oninput="f_('category',this.value)"><label class="l">Display mode</label><select onchange="f_('mode',this.value);render()"><option value="single" ${f.mode=='single'?'selected':''}>Single page</option><option value="multi" ${f.mode=='multi'?'selected':''}>Multi-page (each section is a page)</option></select><label class="l">Closing date</label><input type="date" value="${f.end}" onchange="f_('end',this.value)"><label class="l">Submission limit (0 = none)</label><input type="number" value="${f.limit}" oninput="f_('limit',+this.value)"><label class="l">Confirmation message</label><textarea rows=3 oninput="f_('confirm',this.value)">${esc(f.confirm)}</textarea><label class="opt"><input type="checkbox" ${f.multi?'checked':''} onchange="f_('multi',this.checked)"> Allow multiple submissions</label><p class="mut">Select a question or section in the form to edit it.</p>`}
PAGES.builder=()=>{const f=cur();return `<div class="bt"><button onclick="nav('forms')">${ic('left',16)} Forms</button><b>${esc(f.title)}</b>${badge(f.status)}<span class="sp"></span><button onclick="V.back='builder';V.bid='${f.id}';nav('preview','${f.id}')">Preview</button><button onclick="touch();toast('Draft saved')">Save draft</button>${f.status=='Published'?`<button onclick="fa('${f.id}','unpub')">Unpublish</button>`:`<button class="pr" onclick="fa('${f.id}','pub')">Publish</button>`}</div><div class="tabs">${[['add','Add'],['form','Form'],['props','Settings']].map(([k,l])=>`<button class="${V.tab==k?'on':''}" onclick="V.tab='${k}';render()">${l}</button>`).join('')}</div><div class="bg3 t-${V.tab}"><aside>${left()}</aside><section id="ctr">${center()}</section><aside>${right()}</aside></div>`};
/* ---------- form renderer (one component for every form) ---------- */
const hasv=x=>x!=null&&x!=='';
function optsOf(b,S){if(!b.src)return b.opts.map(o=>({id:o,name:o}));const L=G[b.src];if(!b.parent)return L;const pv=S.ans[b.parent];return pv&&pv!='__o'?L.filter(o=>o.p==pv):[]}
function inp(b,v,d,S){const id=b.id,t=b.type,on=`oninput="frIn('${id}',this.value)"`;
if(['short','email','phone','url','number','date','time'].includes(t))return `<input type="${{short:'text',phone:'tel'}[t]||t}" value="${esc(v??b.def??'')}" placeholder="${esc(b.ph||'')}" ${on} ${d?'disabled':''}>`;
if(t=='long'||t=='address')return `<textarea rows=3 placeholder="${esc(b.ph||'')}" ${on} ${d?'disabled':''}>${esc(v??b.def??'')}</textarea>`;
if(t=='file')return `<input type="file" onchange="frIn('${id}',this.files[0]?this.files[0].name:'')" ${d?'disabled':''}>`;
if(t=='rating')return `<div class="rt">${[1,2,3,4,5].map(n=>`<button class="${v>=n?'on':''}" onclick="frSel('${id}',${n})" ${d?'disabled':''} aria-label="${n} stars">${ic('star',24)}</button>`).join('')}</div>`;
if(t=='scale')return `<div class="row">${[1,2,3,4,5].map(n=>`<button class="${v==n?'pr':''}" onclick="frSel('${id}',${n})" ${d?'disabled':''}>${n}</button>`).join('')}</div>`;
if(t=='dropdown'){const L=optsOf(b,S),pn=b.parent&&flds(S.f).find(x=>x.id==b.parent)?.label,lock=d||(b.parent&&!S.ans[b.parent]);return `<select ${lock?'disabled':''} onchange="frSel('${id}',this.value)"><option value="">${b.parent&&!S.ans[b.parent]?'Select '+esc(pn)+' first':'Select…'}</option>${L.map(o=>`<option value="${esc(o.id)}" ${v==o.id?'selected':''}>${esc(o.name)}</option>`).join('')}${b.other?`<option value="__o" ${v=='__o'?'selected':''}>Other – enter your answer</option>`:''}</select>${v=='__o'?`<input style="margin-top:6px" placeholder="Enter your answer" value="${esc(S.ans[id+'_o']||'')}" oninput="frIn('${id}_o',this.value)" ${d?'disabled':''}>`:''}`}
const ar=t=='check',O=t=='yesno'?['Yes','No']:b.opts,has=o=>ar?(v||[]).includes(o):v==o;
return O.map((o,i)=>`<label class="opt"><input type="${ar?'checkbox':'radio'}" name="${id}" ${has(o)?'checked':''} onchange="frPick('${id}',${i})" ${d?'disabled':''}>${esc(o)}</label>`).join('')+(b.other?`<label class="opt"><input type="${ar?'checkbox':'radio'}" name="${id}" ${has('__o')?'checked':''} onchange="frPick('${id}',-1)" ${d?'disabled':''}>Other – enter your answer</label>${has('__o')?`<input placeholder="Enter your answer" value="${esc(S.ans[id+'_o']||'')}" oninput="frIn('${id}_o',this.value)" ${d?'disabled':''}>`:''}`:'')}
function blockH(b,S,d){const t=b.type;if(t=='heading')return `<h2>${esc(b.label)}</h2>`;if(t=='para')return `<p>${esc(b.label).replace(/\n/g,'<br>')}</p>`;if(t=='divider')return '<hr>';if(t=='link')return `<a href="${esc(b.url)}" target="_blank" rel="noopener">${esc(b.label)}</a>`;
const e=S.err&&S.err[b.id];return `<h4>${esc(b.label)}${b.req?' <span class="rq">*</span>':''}</h4>${b.help?`<div class="mut" style="margin-bottom:6px">${esc(b.help)}</div>`:''}${inp(b,S.ans[b.id],d,S)}${e?`<div class="err">${esc(e)}</div>`:''}`}
let FRS;
function frMount(f){FRS={f,ans:{},pg:0,err:{},done:0};frDraw()}
function kids(id,f){flds(f).filter(b=>b.parent==id).forEach(b=>{delete FRS.ans[b.id];delete FRS.ans[b.id+'_o'];kids(b.id,f)})}
const frIn=(id,v)=>{FRS.ans[id]=v};
function frSel(id,v){const b=flds(FRS.f).find(x=>x.id==id);FRS.ans[id]=['rating','scale'].includes(b.type)?+v:v;kids(id,FRS.f);frDraw()}
function frPick(id,i){const b=flds(FRS.f).find(x=>x.id==id),o=i<0?'__o':(b.type=='yesno'?['Yes','No']:b.opts)[i];if(b.type=='check'){const a=FRS.ans[id]||[];FRS.ans[id]=a.includes(o)?a.filter(x=>x!=o):[...a,o]}else FRS.ans[id]=o;frDraw()}
function frVal(secs){const S=FRS;S.err={};secs.flatMap(s=>s.blocks).filter(b=>!CT.includes(b.type)).forEach(b=>{let v=S.ans[b.id];if(v=='__o'||(Array.isArray(v)&&v.includes('__o')&&v.length==1))v=S.ans[b.id+'_o'];const em=Array.isArray(v)?!v.length:(v===undefined||v==='');
if(b.req&&em){S.err[b.id]=b.err||'This question is required';return}if(em)return;
if(b.type=='email'&&!/^\S+@\S+\.\S+$/.test(v))S.err[b.id]=b.err||'Enter a valid email address';
else if(b.type=='url'&&!/^https?:\/\//.test(v))S.err[b.id]=b.err||'Enter a valid URL starting with http';
else if(b.type=='number'&&((hasv(b.min)&&+v<+b.min)||(hasv(b.max)&&+v>+b.max)))S.err[b.id]=b.err||'Enter a number between '+(b.min||'any')+' and '+(b.max||'any');
else if(['short','long','phone','address'].includes(b.type)&&((+b.min&&String(v).length<+b.min)||(+b.max&&String(v).length>+b.max)))S.err[b.id]=b.err||'Length must be between '+(b.min||0)+' and '+(b.max||'any')+' characters'});return!Object.keys(S.err).length}
function frGo(d){const S=FRS;if(d>0&&!frVal([S.f.sections[S.pg]]))return frDraw();S.pg+=d;S.err={};frDraw();scrollTo(0,0)}
function frSubmit(){const S=FRS,f=S.f;if(!frVal(f.sections)){if(f.mode=='multi')S.pg=f.sections.findIndex(s=>s.blocks.some(b=>S.err[b.id]));frDraw();return toast('Please fix the highlighted answers')}
if(f.limit&&SUBS.filter(s=>s.f==f.id).length>=f.limit)return toast('This form reached its submission limit');
const a={};flds(f).forEach(b=>{let v=S.ans[b.id];if(v===undefined)return;if(v=='__o')v='Other: '+(S.ans[b.id+'_o']||'');if(Array.isArray(v))v=v.map(x=>x=='__o'?'Other: '+(S.ans[b.id+'_o']||''):x);a[b.id]=v});
const cb=flds(f).find(b=>b.label=='Category'),id='SUB-'+(Math.max(...SUBS.map(s=>+s.id.slice(4)))+1),r=summ(f,a);
SUBS.unshift({id,f:f.id,a,r,status:'Submitted',who:'Unassigned',pri:'Medium',cat:cb?a[cb.id]:f.category,at:now(),notes:[],hist:[{s:'Submitted',at:now(),by:'Respondent'}]});
NOTIF.unshift({id:uid('N'),title:f.category=='Complaint'?'New complaint':'New submission',msg:(r.name||'Someone')+' submitted '+f.title,rel:id,read:0,at:now()});act('New submission received: '+id);S.done=1;S.ref=id;frDraw();scrollTo(0,0)}
function frDraw(){const S=FRS,f=S.f,m=f.mode=='multi',el=$('#fr');
if(S.done){el.innerHTML=`<div class="fc hd"><h2>${esc(f.title)}</h2><p>${esc(f.confirm)}</p>${S.ref?`<p>Your reference ID is <b>${S.ref}</b>. Use it on the homepage to track your request.</p>`:''}<div class="row"><button onclick="frMount(fm('${f.id}'))">Submit another response</button><button class="pr" onclick="nav('site')">Back to website</button></div></div>`;return}
const secs=m?[f.sections[S.pg]]:f.sections;
el.innerHTML=`<div class="fc hd"><h2>${esc(f.title)}</h2><p>${esc(f.description)}</p>${m?`<div class="pg"><i style="width:${(S.pg+1)/f.sections.length*100}%"></i></div><div class="mut" style="margin-top:6px">Page ${S.pg+1} of ${f.sections.length}: ${esc(f.sections[S.pg].title)}</div>`:''}</div>`+secs.map(s=>s.blocks.map(b=>`<div class="fc">${blockH(b,S)}</div>`).join('')).join('')+`<div class="fc row">${m&&S.pg>0?`<button onclick="frGo(-1)">Previous</button>`:''}<span class="sp"></span>${m&&S.pg<f.sections.length-1?`<button class="pr" onclick="frGo(1)">Next</button>`:`<button class="pr" onclick="frSubmit()">Submit</button>`}</div>`}
/* ---------- responses & complaints ---------- */
const rBase=()=>V.pg=='pending'?SUBS.filter(s=>['Pending','Submitted'].includes(s.status)):V.pg=='complaints'?SUBS.filter(s=>fm(s.f)&&fm(s.f).category=='Complaint'):SUBS;
const subList=()=>{const q=V.rq,t=q.q.toLowerCase();return rBase().filter(s=>(!q.f||s.f==q.f)&&(!q.st||s.status==q.st)&&(!q.state||s.r.state==q.state)&&(!q.staff||s.who==q.staff)&&(!q.pri||s.pri==q.pri)&&(!t||(s.id+JSON.stringify(s.r)).toLowerCase().includes(t))).sort((a,b)=>b.at.localeCompare(a.at))};
const rRef=()=>$('#st').innerHTML=sTable();
function sTable(){const L=subList(),c=V.pg=='complaints';if(!L.length)return '<div class="card">No submissions match these filters.</div>';return `<div class="tw"><table style="min-width:960px"><tr><th>ID</th><th>Name</th><th>Form</th><th>Email</th><th>Phone</th><th>Institution</th><th>Date</th><th>Status</th>${c?'<th>Priority</th>':''}<th>Assigned</th><th></th></tr>${L.map(s=>`<tr><td>${s.id}</td><td>${esc(s.r.name)}</td><td>${esc(fm(s.f)?.title)}</td><td>${esc(s.r.email)}</td><td>${esc(s.r.phone)}</td><td>${esc(s.r.inst)}</td><td>${fd(s.at)}</td><td>${badge(s.status)}</td>${c?`<td><span class="bd ${{High:'er',Medium:'wa',Low:'gr'}[s.pri]}">${s.pri}</span></td>`:''}<td>${esc(s.who)}</td><td><button class="sm" onclick="openSub('${s.id}')">View</button></td></tr>`).join('')}</table></div>`}
function rPage(){const q=V.rq,c=V.pg=='complaints',B=rBase();return `<div class="fl"><input placeholder="Search name, email, ID" value="${esc(q.q)}" oninput="V.rq.q=this.value;rRef()"><select onchange="V.rq.f=this.value;rRef()"><option value="">All forms</option>${FORMS.map(f=>`<option value="${f.id}" ${q.f==f.id?'selected':''}>${esc(f.title)}</option>`).join('')}</select>${V.pg=='pending'?'':`<select onchange="V.rq.st=this.value;rRef()">${opt(ST,q.st,'All statuses')}</select>`}<select onchange="V.rq.state=this.value;rRef()">${opt(G.state.map(s=>s.name),q.state,'All states')}</select><select onchange="V.rq.staff=this.value;rRef()">${opt(STAFF,q.staff,'All staff')}</select>${c?`<select onchange="V.rq.pri=this.value;rRef()">${opt(PRI,q.pri,'All priorities')}</select>`:''}<button onclick="expSubs(subList(),'responses')">Export CSV</button></div>${c?`<div class="row" style="margin-bottom:12px">${ST.map(s=>`<span>${badge(s)} ${B.filter(x=>x.status==s).length}</span>`).join('')}</div>`:''}<div id="st">${sTable()}</div>`}
PAGES.responses=PAGES.pending=PAGES.complaints=rPage;
const expSubs=(L,n)=>csv([['ID','Form','Name','Email','Phone','Institution','State','District','Status','Priority','Assigned','Submitted'],...L.map(s=>[s.id,fm(s.f)?.title,s.r.name,s.r.email,s.r.phone,s.r.inst,s.r.state,s.r.district,s.status,s.pri,s.who,s.at])],n);
function openSub(id){const s=SUBS.find(x=>x.id==id),f=fm(s.f),sel=(k,L,v)=>`<select onchange="subSet('${id}','${k}',this.value)">${L.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('')}</select>`;
modal(`<div class="row"><h3 style="margin:0">${s.id}</h3>${badge(s.status)}<span class="sp"></span><button class="sm" onclick="closeM()">Close</button></div><p class="mut">${esc(f?.title)} · ${esc(s.cat)} · submitted ${ft(s.at)}</p><div class="card" style="padding:10px">${flds(f).map(b=>`<div style="margin-bottom:8px"><div class="mut">${esc(b.label)}</div>${esc(s.a[b.id]!==undefined?vt(b,s.a[b.id]):'—')}</div>`).join('')}</div>
<div class="fl"><div><label class="l">Status</label>${sel('status',ST,s.status)}</div><div><label class="l">Assigned to</label>${sel('who',STAFF,s.who)}</div><div><label class="l">Priority</label>${sel('pri',PRI,s.pri)}</div></div>
<label class="l">Internal note</label><div class="row"><input id="nt" placeholder="Add a note" style="flex:1"><button class="pr" onclick="addNote('${id}')">Add note</button></div>${s.notes.map(n=>`<p style="margin:6px 0"><span class="mut">${ft(n.at)} · ${esc(n.by)}</span><br>${esc(n.t)}</p>`).join('')}
<label class="l">Status history</label>${s.hist.map(h=>`<div class="row" style="margin:3px 0">${badge(h.s)}<span class="mut">${ft(h.at)} by ${esc(h.by)}</span></div>`).join('')}
<div class="row" style="margin-top:14px"><button onclick="print()">Print</button><button onclick="expSubs([SUBS.find(x=>x.id=='${id}')],'${id}')">Export</button><span class="sp"></span><button class="dg" onclick="delSub('${id}')">Delete</button></div>`)}
function subSet(id,k,v){const s=SUBS.find(x=>x.id==id);s[k]=v;if(k=='status'){s.hist.push({s:v,at:now(),by:'You'});act(id+' status changed to '+v);NOTIF.unshift({id:uid('N'),title:'Complaint status update',msg:id+' is now '+v,rel:id,read:1,at:now()})}toast('Updated');render();openSub(id)}
function addNote(id){const v=$('#nt').value.trim();if(!v)return toast('Write a note first');SUBS.find(x=>x.id==id).notes.unshift({t:v,by:'You',at:now()});openSub(id);toast('Note added')}
function delSub(id){ask('Delete '+id+' permanently?',()=>{SUBS.splice(SUBS.findIndex(x=>x.id==id),1);toast('Deleted');render()})}
/* ---------- notifications ---------- */
PAGES.notifications=()=>{const L=NOTIF.filter(n=>!V.nf||(V.nf=='u'?!n.read:n.read));return `<div class="row" style="margin-bottom:12px"><select style="width:160px" onchange="V.nf=this.value;render()"><option value="">All</option><option value="u" ${V.nf=='u'?'selected':''}>Unread</option><option value="r" ${V.nf=='r'?'selected':''}>Read</option></select><span class="sp"></span><button onclick="NOTIF.forEach(n=>n.read=1);render();toast('All marked as read')">Mark all as read</button></div>`+(L.length?L.map(n=>`<div class="card" style="${n.read?'':'border-left:4px solid var(--p)'}"><div class="row"><b>${esc(n.title)}</b><span class="sp"></span><span class="mut">${ft(n.at)}</span></div><p style="margin:4px 0 10px">${esc(n.msg)}</p><div class="row">${n.rel?`<button class="sm pr" onclick="nOpen('${n.id}')">Open submission</button>`:''}${n.read?'':`<button class="sm" onclick="nRead('${n.id}')">Mark as read</button>`}<button class="sm dg" onclick="nDel('${n.id}')">Delete</button></div></div>`).join(''):'<div class="card">You are all caught up.</div>')};
const nRead=id=>{NOTIF.find(n=>n.id==id).read=1;render()},nDel=id=>{NOTIF.splice(NOTIF.findIndex(n=>n.id==id),1);render();toast('Notification deleted')},nOpen=id=>{const n=NOTIF.find(x=>x.id==id);n.read=1;render();SUBS.find(s=>s.id==n.rel)?openSub(n.rel):toast('That submission no longer exists')};
/* ---------- institutions & dropdown data ---------- */
const lvOf=id=>LV.find(l=>G[l].some(o=>o.id==id));
PAGES.institutions=()=>{const l=V.lv,pl=LV[LV.indexOf(l)-1];return `<div class="row" style="margin-bottom:12px">${LV.map(x=>`<button class="${x==l?'pr':''}" onclick="V.lv='${x}';render()">${LN[x]} (${G[x].length})</button>`).join('')}</div><div class="card"><div class="row" style="margin-bottom:10px"><b>${LN[l]} records</b><span class="sp"></span><button onclick="csv([['id','name','parent_id'],...G['${l}'].map(o=>[o.id,o.name,o.p||''])],'${l}')">Export CSV</button><button class="pr" onclick="geoAdd()">+ Add / import</button></div><div class="tw"><table style="min-width:520px"><tr><th>ID</th><th>Name</th>${pl?`<th>${LN[pl]}</th>`:''}<th>Actions</th></tr>${G[l].map(o=>`<tr><td>${o.id}</td><td>${esc(o.name)}</td>${pl?`<td>${esc(nm(pl,o.p))}</td>`:''}<td><button class="sm" onclick="geoEdit('${o.id}')">Edit</button> <button class="sm dg" onclick="geoDel('${o.id}')">Delete</button></td></tr>`).join('')}</table></div><p class="mut">Forms read these records live: edits appear in connected dropdowns immediately.</p></div>`};
function geoAdd(){const l=V.lv,pl=LV[LV.indexOf(l)-1];modal(`<h3>Add ${LN[l]}</h3>${pl?`<label class="l">${LN[pl]}</label><select id="gp">${G[pl].map(o=>`<option value="${o.id}">${esc(o.name)}</option>`).join('')}</select>`:''}<label class="l">Names (one per line, or paste CSV to import)</label><textarea id="gn" rows=6></textarea><div class="row" style="margin-top:10px"><span class="sp"></span><button onclick="closeM()">Cancel</button><button class="pr" onclick="geoDo()">Save</button></div>`)}
function geoDo(){const l=V.lv,n=$('#gn').value.split(/[\n,]/).map(x=>x.trim()).filter(Boolean),p=$('#gp')?.value;if(!n.length)return toast('Enter at least one name');n.forEach(x=>add(l,x,p));closeM();render();toast(n.length+' added')}
function geoEdit(id){const l=lvOf(id),o=G[l].find(x=>x.id==id);modal(`<h3>Edit ${LN[l]}</h3><input id="gn" value="${esc(o.name)}"><div class="row" style="margin-top:10px"><span class="sp"></span><button onclick="closeM()">Cancel</button><button class="pr" onclick="geoSave('${id}')">Save</button></div>`)}
function geoSave(id){const v=$('#gn').value.trim();if(!v)return toast('Name cannot be empty');G[lvOf(id)].find(x=>x.id==id).name=v;closeM();render();toast('Saved')}
function geoDel(id){const l=lvOf(id);ask('Delete this record and everything under it (e.g. its districts, colleges, departments)?',()=>{const rm=(l,ids)=>{const i=LV.indexOf(l);G[l]=G[l].filter(o=>!ids.includes(o.id));if(LV[i+1])rm(LV[i+1],G[LV[i+1]].filter(o=>ids.includes(o.p)).map(o=>o.id))};rm(l,[id]);render();toast('Deleted')})}
/* ---------- svg icons + square form cards ---------- */
const IP={dashboard:`<rect x='3' y='3' width='7' height='9'/><rect x='14' y='3' width='7' height='5'/><rect x='14' y='12' width='7' height='9'/><rect x='3' y='16' width='7' height='5'/>`,forms:`<path d='M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z'/><path d='M14 3v6h6M8 13h8M8 17h5'/>`,plus:`<path d='M12 5v14M5 12h14'/>`,responses:`<path d='M22 12h-6l-2 3h-4l-2-3H2'/><path d='M5.5 5h13L22 12v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6z'/>`,pending:`<circle cx='12' cy='12' r='9'/><path d='M12 7v5l3 3'/>`,complaints:`<path d='M12 3l10 18H2z'/><path d='M12 10v5M12 18h.01'/>`,institutions:`<path d='M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6M9 10h.01M15 10h.01'/>`,bell:`<path d='M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10 21a2 2 0 0 0 4 0'/>`,menu:`<path d='M4 6h16M4 12h16M4 18h16'/>`,up:`<path d='M12 19V5M5 12l7-7 7 7'/>`,down:`<path d='M12 5v14M19 12l-7 7-7-7'/>`,left:`<path d='M19 12H5M12 19l-7-7 7-7'/>`,star:`<path d='M12 2l3 7 7 .6-5.4 4.8 1.7 7.4L12 17.8l-6.3 4 1.7-7.4L2 9.6 9 9z'/>`,eye:`<path d='M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z'/><circle cx='12' cy='12' r='3'/>`,edit:`<path d='M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z'/>`,copy:`<rect x='9' y='9' width='12' height='12' rx='2'/><path d='M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1'/>`,more:`<circle cx='5' cy='12' r='1'/><circle cx='12' cy='12' r='1'/><circle cx='19' cy='12' r='1'/>`,heart:`<path d='M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z'/>`,help:`<path d='M11 14h2a2 2 0 1 0 0-4h-3c-.6 0-1.1.2-1.4.6L3 16'/><path d='m7 20 1.6-1.4c.3-.4.8-.6 1.4-.6h4c1.1 0 2.1-.4 2.8-1.2l4.6-4.4a2 2 0 0 0-2.75-2.91l-4.2 3.9'/><path d='m2 15 6 6'/><path d='M19.5 8.5c.7-.7 1.5-1.6 1.5-2.7A2.73 2.73 0 0 0 16 4a2.78 2.78 0 0 0-5 1.8c0 1.2.8 2 1.5 2.8L16 12Z'/>`};
const ic=(n,s=18)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IP[n]}</svg>`;
function fTable(L){const c=f=>`<div class="sq"><div class="row" style="flex-wrap:nowrap;gap:6px"><span class="ico">${ic('forms',16)}</span><span class="sp"></span>${badge(f.status)}</div><h4 title="${esc(f.title)}">${esc(f.title)}</h4><div class="mut">${esc(f.category)}<br>${SUBS.filter(s=>s.f==f.id).length} responses · ${fd(f.uAt)}</div><div class="ib"><button title="Edit" aria-label="Edit" onclick="nav('builder','${f.id}')">${ic('edit',15)}</button><button title="Preview" aria-label="Preview" onclick="V.back='forms';nav('preview','${f.id}')">${ic('eye',15)}</button><button title="Clone" aria-label="Clone" onclick="fa('${f.id}','clone')">${ic('copy',15)}</button><label class="mo" title="More actions">${ic('more',15)}<select aria-label="More actions" onchange="fa('${f.id}',this.value);this.value=''"><option value="">More actions</option><option value="pub">Publish</option><option value="unpub">Unpublish</option><option value="pause">Pause submissions</option><option value="resp">View responses</option><option value="exp">Export responses</option><option value="arch">Archive</option><option value="del">Delete</option></select></label></div></div>`;return `<div class="fg"><div class="sq add" role="button" tabindex="0" onclick="newForm()" onkeydown="if(event.key=='Enter')newForm()">${ic('plus',34)}<b>Create new form</b><span class="mut">Start from a blank form</span></div>${L.map(c).join('')}</div>`+(L.length?'':'<p class="mut">No forms match these filters.</p>')}
PAGES.forms=()=>{const q=V.fq;return `<div class="fl"><input placeholder="Search by form title" value="${esc(q.q)}" oninput="V.fq.q=this.value;fRef()"><select onchange="V.fq.st=this.value;fRef()">${opt(['Draft','Published','Unpublished','Paused','Archived'],q.st,'All statuses')}</select><select onchange="V.fq.cat=this.value;fRef()">${opt([...new Set(FORMS.map(f=>f.category))],q.cat,'All categories')}</select><select onchange="V.fq.sort=this.value;fRef()">${[['new','Newest'],['old','Oldest'],['sub','Most submissions']].map(([k,l])=>`<option value="${k}" ${q.sort==k?'selected':''}>${l}</option>`).join('')}</select></div><div id="ft">${fTable(fList())}</div>`};
IP.lock=`<rect x='4' y='11' width='16' height='10' rx='2'/><path d='M8 11V7a4 4 0 0 1 8 0v4'/>`;IP.logout=`<path d='M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9'/>`;IP.globe=`<circle cx='12' cy='12' r='9'/><path d='M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18'/>`;
/* ---------- public complaint website ---------- */
const CC={Complaint:'#DC2626',Education:'#2563EB',Scholarship:'#7C3AED',Volunteer:'#16A34A',Membership:'#0891B2',Feedback:'#EA580C',Event:'#DB2777'},CI={Complaint:'complaints',Education:'institutions',Scholarship:'star',Volunteer:'heart',Membership:'forms',Feedback:'responses',Event:'pending'};
const brandH=`<div class="brand" style="padding:0"><i>${ic('help',16)}</i>Vijrumbhana</div>`;
function siteDraw(){const P=FORMS.filter(f=>f.status=='Published'),cats=[...new Set(P.map(f=>f.category))],sc=V.sc||'',show=cats.filter(c=>!sc||c==sc);
$('#app').innerHTML=`<div class="sitewrap"><header class="sb"><div class="in">${brandH}<span class="sp"></span><button class="pr" onclick="$('#cats').scrollIntoView({behavior:'smooth'})">File a complaint</button></div></header><main><section class="hero"><div class="hero-img" role="img" aria-label="Hand placing a ballot into a ballot box"></div><div class="hero-body"><h1>Your voice matters. Tell us what went wrong.</h1><p>Raise a complaint, apply for support or share feedback. Pick a category below and our team will respond.</p><div class="row hero-form"><input id="tk" placeholder="Track with reference ID, e.g. SUB-2001" style="flex:1;min-width:0" onkeydown="if(event.key=='Enter')trackId()"><button class="pr" onclick="trackId()">Track</button></div><div id="tr" class="hero-res"></div></div></section>
<section class="sw" id="cats"><h2 style="margin-top:0">Choose a category</h2><div class="chips"><button class="${sc?'':'on'}" onclick="V.sc='';siteDraw()">All</button>${cats.map(c=>`<button class="${sc==c?'on':''}" onclick="V.sc='${c}';siteDraw()">${c}</button>`).join('')}</div>${show.map(c=>`<h3 style="display:flex;align-items:center;justify-content:center;gap:8px"><span class="ico" style="background:${CC[c]||'#2563EB'};color:#fff">${ic(CI[c]||'forms',16)}</span>${c} <span class="mut">${P.filter(f=>f.category==c).length} form(s)</span></h3><div class="cg" style="margin-bottom:24px">${P.filter(f=>f.category==c).map(f=>`<div class="cc" style="border-top:3px solid ${CC[c]||'#2563EB'}"><b>${esc(f.title)}</b><span class="mut" style="flex:1">${esc(f.description)}</span><button class="pr" onclick="openPub('${f.id}')">Open form</button></div>`).join('')}</div>`).join('')}</section></main>
<footer class="foot"><div class="fcols"><div><div class="brand" style="padding:0;color:#fff"><i>${ic('help',16)}</i>Vijrumbhana</div><p style="margin-top:10px">Vijrumbhana Foundation helps people raise complaints, apply for support and share feedback, and makes sure every request gets a response.</p></div><div><h4>Contact us</h4><p>help@seva.example</p><p>+91 90000 00000</p><p>Mon – Sat, 9:00 AM – 6:00 PM</p></div><div><h4>Quick links</h4><button class="fl2" onclick="$('#cats').scrollIntoView({behavior:'smooth'})">File a complaint</button><button class="fl2" onclick="$('#tk').focus();window.scrollTo({top:0,behavior:'smooth'})">Track a request</button></div></div><div class="fb"><div class="in"><span>© 2026 Vijrumbhana Foundation. All rights reserved.</span><span class="sp"></span><button class="adm" onclick="pinAsk()">Admin</button></div></div></footer></div>`}
const openPub=id=>{V.id=id;V.pg='pubform';render();scrollTo(0,0)};
function pubDraw(){$('#app').innerHTML=`<div class="sitewrap"><header class="sb"><div class="in">${brandH}<span class="sp"></span><button onclick="nav('site')">${ic('left',16)} All forms</button></div></header><main><div class="fpg" id="fr"></div></main></div>`;frMount(fm(V.id))}
function trackId(){const id=$('#tk').value.trim().toUpperCase(),s=SUBS.find(x=>x.id==id);$('#tr').innerHTML=s?`<div class="card" style="margin:0"><div class="row"><b>${s.id}</b>${badge(s.status)}</div><div class="mut">${esc(fm(s.f)?.title)} · ${fd(s.at)}</div>${s.hist.map(h=>`<div class="row" style="margin-top:4px">${badge(h.s)}<span class="mut">${ft(h.at)}</span></div>`).join('')}</div>`:'<div class="err">No submission found with that reference ID.</div>'}
const pinAsk=()=>modal(`<h3>Admin login</h3><p class="mut">Enter the admin PIN to continue.</p><div class="pin"><input id="pn" type="password" inputmode="numeric" maxlength="5" autocomplete="off" aria-label="Admin PIN" onkeydown="if(event.key=='Enter')pinGo()"></div><div id="pe" class="err"></div><div class="row" style="margin-top:12px"><span class="sp"></span><button onclick="closeM()">Cancel</button><button class="pr" onclick="pinGo()">Login</button></div>`);
const pinGo=()=>{if($('#pn').value==='99999'){V.admin=1;closeM();nav('dashboard');toast('Welcome, admin')}else $('#pe').textContent='Incorrect PIN. Try again.'};
const _rd=render;render=function(){if(V.pg=='site')return siteDraw();if(V.pg=='pubform')return pubDraw();_rd()};
render();
</script>
</body></html>

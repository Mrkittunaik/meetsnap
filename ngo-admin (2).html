const brandH=`<div class="brand" style="padding:0"><i>${ic('heart',15)}</i>Seva Support</div>`;
function siteDraw(){const P=FORMS.filter(f=>f.status=='Published'),cats=[...new Set(P.map(f=>f.category))],sc=V.sc||'',show=cats.filter(c=>!sc||c==sc);
$('#app').innerHTML=`<div class="sitewrap"><header class="sb"><div class="in">${brandH}<span class="sp"></span><button class="pr" onclick="$('#cats').scrollIntoView({behavior:'smooth'})">File a complaint</button></div></header><main><section class="hero"><h1>Your voice matters. Tell us what went wrong.</h1><p>Raise a complaint, apply for support or share feedback. Pick a category below and our team will respond.</p><div class="row" style="max-width:440px;margin:0 auto;flex-wrap:nowrap"><input id="tk" placeholder="Track with reference ID, e.g. SUB-2001" style="flex:1" onkeydown="if(event.key=='Enter')trackId()"><button class="pr" onclick="trackId()">Track</button></div><div id="tr" style="max-width:440px;margin:12px auto 0;text-align:left"></div></section>
<section class="sw" id="cats"><h2 style="margin-top:0">Choose a category</h2><div class="chips"><button class="${sc?'':'on'}" onclick="V.sc='';siteDraw()">All</button>${cats.map(c=>`<button class="${sc==c?'on':''}" onclick="V.sc='${c}';siteDraw()">${c}</button>`).join('')}</div>${show.map(c=>`<h3 style="display:flex;align-items:center;gap:8px"><span class="ico" style="background:${CC[c]||'#2563EB'};color:#fff">${ic(CI[c]||'forms',16)}</span>${c} <span class="mut">${P.filter(f=>f.category==c).length} form(s)</span></h3><div class="cg" style="margin-bottom:24px">${P.filter(f=>f.category==c).map(f=>`<div class="cc" style="border-top:3px solid ${CC[c]||'#2563EB'}"><b>${esc(f.title)}</b><span class="mut" style="flex:1">${esc(f.description)}</span><button class="pr" onclick="openPub('${f.id}')">Open form</button></div>`).join('')}</div>`).join('')}</section></main>
<footer class="foot"><div class="in"><b>Seva Support Foundation</b><span class="mut">help@seva.example · +91 90000 00000</span><span class="sp"></span><button onclick="pinAsk()">${ic('lock',15)} Admin</button></div></footer></div>`}
const openPub=id=>{V.id=id;V.pg='pubform';render();scrollTo(0,0)};
function pubDraw(){$('#app').innerHTML=`<div class="sitewrap"><header class="sb"><div class="in">${brandH}<span class="sp"></span><button onclick="nav('site')">${ic('left',16)} All forms</button></div></header><main><div class="fpg" id="fr"></div></main></div>`;frMount(fm(V.id))}
function trackId(){const id=$('#tk').value.trim().toUpperCase(),s=SUBS.find(x=>x.id==id);$('#tr').innerHTML=s?`<div class="card" style="margin:0"><div class="row"><b>${s.id}</b>${badge(s.status)}</div><div class="mut">${esc(fm(s.f)?.title)} · ${fd(s.at)}</div>${s.hist.map(h=>`<div class="row" style="margin-top:4px">${badge(h.s)}<span class="mut">${ft(h.at)}</span></div>`).join('')}</div>`:'<div class="err">No submission found with that reference ID.</div>'}
const pinAsk=()=>modal(`<h3>Admin login</h3><p class="mut">Enter the admin PIN to continue.</p><div class="pin"><input id="pn" type="password" inputmode="numeric" maxlength="5" autocomplete="off" aria-label="Admin PIN" onkeydown="if(event.key=='Enter')pinGo()"></div><div id="pe" class="err"></div><div class="row" style="margin-top:12px"><span class="sp"></span><button onclick="closeM()">Cancel</button><button class="pr" onclick="pinGo()">Login</button></div>`);
const pinGo=()=>{if($('#pn').value==='99999'){V.admin=1;closeM();nav('dashboard');toast('Welcome, admin')}else $('#pe').textContent='Incorrect PIN. Try again.'};
const _rd=render;render=function(){if(V.pg=='site')return siteDraw();if(V.pg=='pubform')return pubDraw();_rd()};
render();
</script>
</body></html>
